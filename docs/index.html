<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex">
<title>Vinyline</title>
<style>
  :root {
    --bg: #111111;
    --fg: #f2efe8;
    --muted: #8a867e;
    --accent: #e8b44a;
    --disc: #1c1c1c;
    --groove: #262626;
    --line: #333333;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    text-align: center;
    user-select: none;
  }
  main { display: flex; flex-direction: column; align-items: center; }
  main[hidden] { display: none; }
  .disc {
    position: relative;
    width: min(68vw, 280px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: none;
    padding: 0;
    cursor: pointer;
    background:
      radial-gradient(circle, var(--accent) 0 17%, var(--bg) 17% 19%, transparent 19%),
      repeating-radial-gradient(circle, var(--disc) 0 3px, var(--groove) 3px 4px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    transition: transform 0.15s;
  }
  .disc:active { transform: scale(0.97); }
  .disc.spin { animation: spin 3.2s linear infinite; }
  .disc:disabled { cursor: default; opacity: 0.5; }
  @keyframes spin { to { rotate: 360deg; } }
  .icon {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  .icon svg { width: 13%; height: 13%; fill: var(--bg); }
  .status {
    margin-top: 24px;
    font-size: 15px;
    color: var(--muted);
    min-height: 1.4em;
    max-width: 320px;
  }
  .status.error { color: #e57b6b; }
  .controls {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    visibility: hidden;
  }
  .controls.on { visibility: visible; }
  .ghost {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  .ghost:active { background: #222; }
  .scan-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 32px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 999px;
    padding: 14px 26px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .scan-btn:active { transform: scale(0.97); }
  .scan-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  .bar {
    width: min(68vw, 280px);
    height: 3px;
    background: #2a2a2a;
    border-radius: 2px;
    margin-top: 20px;
    overflow: hidden;
    visibility: hidden;
  }
  .bar.on { visibility: visible; }
  .bar div { height: 100%; width: 0; background: var(--accent); transition: width 0.25s linear; }
  .home h1 { font-size: 22px; font-weight: 600; margin: 0 0 12px; }
  .home p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 auto; max-width: 300px; }

  /* Scanner plein écran */
  .scanner {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .scanner[hidden] { display: none; }
  .scanner video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .scanner .frame {
    position: relative;
    width: min(70vw, 300px);
    aspect-ratio: 1;
    border-radius: 18px;
    box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.55);
    outline: 3px solid var(--accent);
  }
  .scanner .hint {
    position: relative;
    margin-top: 24px;
    color: #fff;
    font-size: 15px;
    max-width: 300px;
  }
  .scanner .hint.error { color: #f0a090; }
  .scanner .close {
    position: absolute;
    bottom: max(32px, env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 15px;
    cursor: pointer;
  }

  /* Le lecteur YouTube existe mais reste invisible : rien ne dévoile le morceau. */
  #player-wrap {
    position: fixed;
    width: 200px;
    height: 200px;
    left: 0;
    bottom: 0;
    opacity: 0;
    pointer-events: none;
    z-index: -1;
  }
</style>
</head>
<body>
  <main id="game" hidden>
    <button class="disc" id="disc" aria-label="Lecture" disabled>
      <span class="icon" id="icon"></span>
    </button>
    <div class="bar" id="bar"><div id="progress"></div></div>
    <div class="status" id="status">Chargement…</div>
    <div class="controls" id="controls">
      <button class="ghost" id="restart">Reprendre au début</button>
      <button class="ghost" id="fwd">+10 s</button>
    </div>
    <button class="scan-btn js-scan">
      <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>
      Lire le prochain QR code
    </button>
  </main>

  <main id="home" class="home" hidden>
    <h1><img src="logo.svg" alt="" style="width:1.1em;height:1.1em;vertical-align:-0.18em;margin-right:0.3em">Vinyline</h1>
    <p>Scanne le QR code d'une carte pour écouter le morceau.</p>
    <button class="scan-btn js-scan">
      <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>
      Scanner une carte
    </button>
  </main>

  <div class="scanner" id="scanner" hidden>
    <video id="cam" playsinline muted autoplay></video>
    <div class="frame"></div>
    <div class="hint" id="scan-hint">Vise le QR code de la carte</div>
    <button class="close" id="scan-close">Annuler</button>
  </div>

  <div id="player-wrap"><div id="player"></div></div>

<script>
  const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';
  const JSQR_URL = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";

  const $ = (id) => document.getElementById(id);

  let cartes = null;
  let code = "";
  let card = null;
  let player = null;
  let ready = false;
  let playing = false;
  let tick = null;
  let apiLoading = null;

  // ---------- Affichage ----------

  function setStatus(text, isError = false) {
    $("status").textContent = text;
    $("status").classList.toggle("error", isError);
  }

  function setPlaying(on) {
    playing = on;
    $("icon").innerHTML = on ? ICON_PAUSE : ICON_PLAY;
    $("disc").classList.toggle("spin", on);
    $("disc").setAttribute("aria-label", on ? "Pause" : "Lecture");
  }

  function resetView() {
    setPlaying(false);
    $("controls").classList.remove("on");
    $("bar").classList.remove("on");
    $("progress").style.width = "0";
  }

  function startTick() {
    clearInterval(tick);
    tick = setInterval(() => {
      if (!player || !player.getDuration) return;
      const d = player.getDuration();
      const t = player.getCurrentTime();
      if (d > 0) $("progress").style.width = Math.min(100, (t / d) * 100) + "%";
    }, 250);
  }

  // ---------- Données ----------

  async function loadCartes() {
    if (cartes) return cartes;
    const res = await fetch("cartes.json?v=" + Date.now());
    cartes = await res.json();
    return cartes;
  }

  function codeFromText(text) {
    // Accepte une URL de carte (…?c=0042) ou directement l'ID.
    try {
      const c = new URL(text).searchParams.get("c");
      if (c) return c.trim().toUpperCase();
    } catch (e) { /* pas une URL */ }
    const t = text.trim().toUpperCase();
    return /^[A-Z]?\d{3,5}$/.test(t) ? t : "";
  }

  // ---------- Lecteur YouTube ----------

  function loadYouTubeApi() {
    if (apiLoading) return apiLoading;
    apiLoading = new Promise((resolve) => {
      window.onYouTubeIframeAPIReady = resolve;
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
    });
    return apiLoading;
  }

  async function createPlayer() {
    await loadYouTubeApi();
    return new Promise((resolve) => {
      player = new YT.Player("player", {
        host: "https://www.youtube-nocookie.com",
        width: 200,
        height: 200,
        videoId: card.v,
        playerVars: { start: card.s || 0, playsinline: 1, controls: 0, disablekb: 1, rel: 0 },
        events: {
          onReady: () => { ready = true; resolve(); },
          onStateChange: onStateChange,
          onError: onError,
        },
      });
    });
  }

  function onStateChange(e) {
    const S = YT.PlayerState;
    if (e.data === S.PLAYING) {
      setPlaying(true);
      setStatus("");
      $("controls").classList.add("on");
      $("bar").classList.add("on");
      startTick();
    } else if (e.data === S.BUFFERING) {
      setStatus("Chargement…");
    } else if (e.data === S.PAUSED) {
      setPlaying(false);
      setStatus("En pause");
    } else if (e.data === S.ENDED) {
      setPlaying(false);
      setStatus("Terminé");
    }
  }

  function onError(e) {
    setPlaying(false);
    $("disc").disabled = true;
    const msg = e.data === 101 || e.data === 150
      ? "Cette vidéo ne peut pas être lue ici. Change son ID dans le CSV."
      : "Vidéo introuvable ou supprimée. Change son ID dans le CSV.";
    setStatus(msg + " (carte " + code + ")", true);
  }

  // ---------- Ouverture d'une carte ----------

  async function openCard(newCode, autoplay) {
    code = newCode;
    $("home").hidden = true;
    $("game").hidden = false;
    $("disc").disabled = true;
    $("icon").innerHTML = ICON_PLAY;
    resetView();
    setStatus("Chargement…");

    // L'URL suit la carte en cours, pour qu'un rechargement reste sur la bonne.
    history.replaceState(null, "", "?c=" + encodeURIComponent(code));

    try {
      await loadCartes();
    } catch (e) {
      setStatus("Impossible de charger la liste des cartes.", true);
      return;
    }
    card = cartes[code];
    if (!card) {
      if (player && ready) player.stopVideo();
      setStatus("Carte inconnue ou pas encore prête.", true);
      return;
    }

    if (!player) {
      await createPlayer();
      $("disc").disabled = false;
      setStatus("Appuie sur le disque");
      return;
    }

    $("disc").disabled = false;
    if (autoplay) {
      player.loadVideoById({ videoId: card.v, startSeconds: card.s || 0 });
      // Si le navigateur bloque la lecture automatique, on demande un appui.
      setTimeout(() => {
        if (!playing && cartes[code] === card) setStatus("Appuie sur le disque");
      }, 2500);
    } else {
      player.cueVideoById({ videoId: card.v, startSeconds: card.s || 0 });
      setStatus("Appuie sur le disque");
    }
  }

  // ---------- Scanner ----------

  let stream = null;
  let scanning = false;
  let jsqrLoading = null;
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  function loadJsQR() {
    if (window.jsQR) return Promise.resolve();
    if (jsqrLoading) return jsqrLoading;
    jsqrLoading = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = JSQR_URL;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
    return jsqrLoading;
  }

  function scanHint(text, isError = false) {
    $("scan-hint").textContent = text;
    $("scan-hint").classList.toggle("error", isError);
  }

  async function openScanner() {
    if (player && ready && playing) player.pauseVideo();
    $("scanner").hidden = false;
    scanHint("Vise le QR code de la carte");
    try {
      await loadJsQR();
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" },
        audio: false,
      });
    } catch (e) {
      scanHint("Caméra indisponible. Autorise l'accès à la caméra pour ce site.", true);
      return;
    }
    const video = $("cam");
    video.srcObject = stream;
    await video.play().catch(() => {});
    scanning = true;
    requestAnimationFrame(scanFrame);
  }

  function closeScanner() {
    scanning = false;
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null;
    $("cam").srcObject = null;
    $("scanner").hidden = true;
  }

  function scanFrame() {
    if (!scanning) return;
    const video = $("cam");
    if (video.readyState >= 2 && video.videoWidth) {
      // Image réduite : bien plus rapide, et suffisant pour un QR qui remplit le cadre.
      const scale = Math.min(1, 480 / video.videoWidth);
      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const qr = jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
      if (qr && qr.data) {
        const c = codeFromText(qr.data);
        if (c) {
          if (navigator.vibrate) navigator.vibrate(60);
          closeScanner();
          openCard(c, true);
          return;
        }
        scanHint("Ce QR code n'est pas une carte du jeu", true);
      }
    }
    requestAnimationFrame(scanFrame);
  }

  // ---------- Boutons ----------

  $("disc").addEventListener("click", () => {
    if (!ready) return;
    if (playing) player.pauseVideo();
    else player.playVideo();
  });
  $("restart").addEventListener("click", () => {
    if (!ready) return;
    player.seekTo(card.s || 0, true);
    player.playVideo();
  });
  $("fwd").addEventListener("click", () => {
    if (!ready) return;
    player.seekTo(player.getCurrentTime() + 10, true);
  });
  document.querySelectorAll(".js-scan").forEach((b) => b.addEventListener("click", openScanner));
  $("scan-close").addEventListener("click", closeScanner);

  // ---------- Démarrage ----------

  const initial = (new URLSearchParams(location.search).get("c") || "").trim().toUpperCase();
  if (initial) openCard(initial, false);
  else $("home").hidden = false;
</script>
</body>
</html>
